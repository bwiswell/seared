[project]
name = "seared"
version = "0.2.2"
description = "A lightweight Python serialization/deserialization tool"
authors = [
    { name = "Benj Wiswell", email = "benjwiswell@gmail.com" },
]
requires-python = ">=3.11,<4.0"
dependencies = []

[project.scripts]
seared-doc = "seared.doc.generate:main"

[project.optional-dependencies]
numpy  = ["numpy>=2.4.2,<3.0"]
yaml   = ["pyyaml>=6.0"]
toml   = ["tomli-w>=1.0"]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
all    = [
    "numpy>=2.4.2,<3.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "pandas>=2.0",
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ty",
    "seared[all]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seared"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
# importlib mode lets multiple ``test_init.py`` (one per Pattern B
# subdir) coexist without basename collisions during collection.
addopts = "--import-mode=importlib"
