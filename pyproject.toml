[project]
name = "seared"
version = "0.2.6"
description = "A lightweight Python serialization/deserialization tool"
authors = [
    { name = "Benj Wiswell", email = "benjwiswell@gmail.com" },
]
requires-python = ">=3.14,<4.0"
dependencies = []

[project.scripts]
seared-doc = "seared.doc.generate:main"

[project.optional-dependencies]
numpy  = ["numpy>=2.4.2,<3.0"]
yaml   = ["pyyaml>=6.0"]
toml   = ["tomli-w>=1.0"]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
all    = [
    "numpy>=2.4.2,<3.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "pandas>=2.0",
    "polars>=1.0",
]
# Comparator libraries for the repo-only bench (`uv run python -m bench`);
# never runtime dependencies.
bench  = [
    "marshmallow>=3.26,<5.0",
    "pydantic>=2.11,<3.0",
]

[dependency-groups]
dev = [
    "deptry",
    "prek",
    "pytest>=8.0,<9.0",
    "ruff",
    "ty",
    "seared[all]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seared"]

# The bench ships with the repo, not the package.
[tool.hatch.build.targets.sdist]
exclude = ["/bench"]

[tool.ruff]
line-length = 120
target-version = "py314"
indent-width = 4
# Ruff formats Python code blocks inside Markdown. Off here: the docs align
# field declarations into columns deliberately, and several ```python blocks
# show *JSON* wire form, which the formatter rewrites to single quotes.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM",     # comma rules (formatter owns these)
    "CPY",     # copyright notice at top of file
    "FLY",     # str.join -> f-string (we join to avoid the {{}} brace footgun)
    "D100",    # missing docstring in public module
    "D101",    # missing docstring in public class
    "D104",    # missing docstring in public package
    "PLC0415", # allow intentional lazy imports
    "TD",      # TODO formatting
    "FIX002",  # disallow TODOs
    "TRY003",  # long messages outside exception class
    # --- seared-specific deviations from the house list ---
    "ANN401",  # `Any` *is* the wire boundary type; (de)serialize are dynamically typed by design
    "FBT001",  # `validate: bool = True` is established public API on every Field method...
    "FBT002",  # ...so making it keyword-only would be a breaking change for consumers
    "A002",    # the public carrier-hint kwarg is spelled `format=` (shadows the builtin)
    "A006",    # ditto, for the lambdas the decorator builds around it
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.flake8-unused-arguments]
# Most fields accept the optional codec hints (`format=`, ...) and ignore them;
# the uniform `**kwargs` tail is the point, not an oversight.
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
# `N` — tests alias field types to initials (`Decimal as D`) and name cases after
# them (`test_T_field_rejected`); `DTZ` — naive datetimes are fixtures under test.
"tests/**/*.py" = ["S", "SLF", "ANN", "D", "INP", "ARG", "PLR", "N", "DTZ"]
# Field constructors are deliberately PascalCase — classes in the .py, overload
# stubs in the .pyi. Only the stubs read as "functions" to pep8-naming.
"seared/fields/*.pyi" = ["N802"]
# CLIs whose product *is* stdout.
"seared/doc/generate.py" = ["T201"]
"bench/**/*.py" = ["T201"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "single"

[tool.deptry.package_module_name_map]
# The comparator packages live behind the repo-only `[bench]` extra, so a
# default dev sync doesn't install them and deptry can't introspect their
# module names. Naming them keeps `bench/` in scope (its imports still get
# checked against the extra) instead of excluding it wholesale.
marshmallow = ["marshmallow"]
pydantic = ["pydantic"]

[tool.ty.src]
# The comparator bench suites import `seared[bench]` extras (marshmallow,
# pydantic) that a default dev sync doesn't install; ty skips just those.
exclude = [
    "tests",
    "bench/suite_marshmallow.py",
    "bench/suite_pydantic.py",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
# importlib mode lets multiple ``test_init.py`` (one per Pattern B
# subdir) coexist without basename collisions during collection.
addopts = "--import-mode=importlib"
